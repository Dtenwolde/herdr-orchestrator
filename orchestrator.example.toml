# Optional settings for herdr-status, orch-watch and orch-pick.
# Copy to orchestrator.toml (git-ignored) and change what you need; everything has a default.

# Where your git worktrees live. Only used to infer r/b/f kind tags from paths like
# <worktree_root>/bug/foo (see kind_tags).
# worktree_root = "~/git/worktrees"

# Branches that never have a PR of their own (regex).
# base_branches = '^(main|master|develop|trunk|v\d+\.\d+.*)$'

# Extra GitHub logins whose comments never count as feedback (logins ending in [bot] never do).
# bots = ["my-ci-bot"]

# Restore r/b/f workspace kind tags (sidebar token $kind) inferred from branch or path prefixes
# such as pr/, review-, bug/, fix/, feat/. Herdr drops workspace metadata on a server restart.
# kind_tags = false

# GitHub Projects boards to include. Items marked as code review join the inbox as "review owed"
# (or the card of your review worktree); everything else gets a compact section per board. Items a
# workspace handles show on its card. Needs the read:project scope: gh auth refresh -s read:project
#
# [[projects]]
# owner = "my-org"                  # organization or user
# number = 7                        # from https://github.com/orgs/my-org/projects/7
# view = 2                          # use this view's filter; or set filter = "assignee:@me -status:Done"
# status_field = "Status"           # single-select field shown as the status (default Status)
# review_field = "Type"             # single-select field that marks review items...
# review_value = "Code Review"      # ...when it has this value (pull requests by others always count)
# blocked_statuses = ["Blocked"]    # review items in these statuses rank WAITING instead of SOON
# collapsed_statuses = ["Long-running"]  # shown as one line

# Beans (https://github.com/hmans/beans), a markdown issue tracker. On by default when the `beans`
# command and a config (BEANS_CONFIG, or `config` below) are found. Beans that need you (a decision
# tag, or critical and ready) join the inbox or the card of the workspace they belong to; the other
# open beans get one BEANS section. A bean belongs to a workspace when the workspace claims its tag
# (`beans = ["tag"]` in overrides.toml), its body links the workspace's PR, a tag names the workspace
# or branch, or the workspace is the only one open for the bean's project (a top-level epic named
# after its tag, e.g. epic "my-repo" tagged my-repo).
#
# [beans]
# enabled = "auto"                      # true, false or "auto"
# config = "~/tracker/.beans.yml"       # default: $BEANS_CONFIG
# decision_tags = ["needs-decision"]    # beans waiting on a decision from you
# waiting_tags = ["external"]           # in-progress beans with these tags show as waiting
# collapsed = ["blocked", "draft"]      # states shown as a count

[watch]
# interval = 60            # seconds between ticks; Herdr events refresh in between
# briefing_at = "09:00"    # weekday briefing (or when you open the orchestrator workspace)
# what_moved_at = "18:00"  # end-of-day "What moved today"
# agent = "orchestrator"   # Herdr agent name of the orchestrator Claude session
